name: Compilar APK DeFitt

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar y publicar DeFitt APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar licencias del Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Preparar archivos de configuración y firma
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          ls -lh debug.keystore .env

      - name: Compilar APK instalable de DeFitt
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Ejecutar pruebas unitarias y Robolectric
        continue-on-error: true
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2500m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Preparar APK final (Release si hay firma, o Debug instalable)
        id: release_build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            cp app/build/outputs/apk/release/app-release.apk dist/DeFitt.apk
            echo "apk_mode=release" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/DeFitt.apk
            echo "apk_mode=debug" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist/DeFitt.apk

      - name: Subir DeFitt.apk como artefacto de Acciones
        uses: actions/upload-artifact@v4
        with:
          name: DeFitt-APK
          path: dist/DeFitt.apk
          retention-days: 30

      - name: Publicar DeFitt.apk en Releases para descarga directa
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="APK instalable oficial de DeFitt (modo: ${{ steps.release_build.outputs.apk_mode }}). Descarga DeFitt.apk e instálalo directamente en tu dispositivo Android."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/DeFitt.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest dist/DeFitt.apk \
              --title "DeFitt APK" \
              --notes "$NOTES"
          fi
