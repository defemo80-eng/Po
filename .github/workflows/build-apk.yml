name: Compilar APK DeFitt

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar y publicar DeFitt APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Preparar debug.keystore desde base64
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Ejecutar pruebas unitarias y compilar APK instalable
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Compilar Release APK si existen secretos de firma
        id: release_build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk dist/DeFitt.apk
            echo "apk_mode=release" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/DeFitt.apk
            echo "apk_mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir DeFitt.apk como artefacto de Acciones
        uses: actions/upload-artifact@v4
        with:
          name: DeFitt-APK
          path: dist/DeFitt.apk
          retention-days: 30

      - name: Publicar DeFitt.apk en Releases para descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="APK instalable oficial de DeFitt (modo: ${{ steps.release_build.outputs.apk_mode }}). Descarga DeFitt.apk e instálalo directamente en tu dispositivo Android."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/DeFitt.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest dist/DeFitt.apk \
              --title "DeFitt APK" \
              --notes "$NOTES"
          fi
